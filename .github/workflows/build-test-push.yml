name: Build, test and push

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  # Manual, on-demand image build for any ref (e.g. main). Main pushes never publish an
  # image on their own; run this to cut one when you actually want it.
  workflow_dispatch: {}

# Cancel superseded runs for the same PR, but never interrupt a release (tag) or a manual
# on-demand build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Validate Helm chart
        run: |
          helm lint --strict chart
          helm template ansible-operator chart --namespace ansible-system > /dev/null
          parent_version="$(grep -m1 '^version:' chart/Chart.yaml | awk '{print $2}')"
          dependency_version="$(grep -m1 '^    version:' chart/Chart.yaml | awk '{print $2}')"
          crds_version="$(grep -m1 '^version:' chart/charts/crds/Chart.yaml | awk '{print $2}')"
          test "$parent_version" = "$dependency_version"
          test "$parent_version" = "$crds_version"

      - name: Verify CRD installation toggle
        run: |
          test "$(helm template ansible-operator chart --namespace ansible-system | grep -c '^kind: CustomResourceDefinition$')" -eq 5
          test "$(helm template ansible-operator chart --namespace ansible-system --set crds.install=false | grep -c '^kind: CustomResourceDefinition$')" -eq 0

  # Rust-backed validation for ordinary commits (PRs and main pushes): runs the tests and
  # verifies that the checked-in chart CRDs still match the Rust resource definitions.
  test:
    runs-on: ubuntu-latest

    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Verify generated CRDs are current
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          mkdir -p "$tmp_dir/templates"
          cat > "$tmp_dir/annotation" <<'ANNOTATION'
            {{- if .Values.keep }}
            annotations:
              helm.sh/resource-policy: keep
            {{- end }}
          ANNOTATION
          cargo run --quiet -- crds > "$tmp_dir/all-crds.yaml"
          csplit -z -f "$tmp_dir/crd-" "$tmp_dir/all-crds.yaml" '/^---$/' '{*}' > /dev/null
          for file in "$tmp_dir"/crd-*; do
            name="$(grep -m1 '^  name:' "$file" | awk '{print $2}')"
            sed -i '/^---$/d' "$file"
            sed -i "/^metadata:$/r $tmp_dir/annotation" "$file"
            cp "$file" "$tmp_dir/templates/${name}.yaml"
          done
          diff -rs "$tmp_dir/templates" chart/charts/crds/templates

  # The embedded Python scripts are not compiled by cargo and so are not covered by the job
  # above. Deliberately a job of its own rather than a step in it: it needs no Rust toolchain and
  # no cache, it runs in seconds, and keeping it separate means a broken gate script is reported as
  # itself rather than as "tests failed". Stdlib `unittest` only, so the runner's python3 is the
  # whole dependency.
  test-python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run Python tests
        run: python3 -m unittest discover --start-directory tests/python --verbose

  # Release build. Only runs for real releases (v*.*.* tags) or an explicit manual build —
  # `cargo build --release` never runs on ordinary commits. Compiled in bookworm so the
  # binary's glibc matches the distroless/cc-debian12 runtime it is COPY'd into.
  compile:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, test-python, chart]
    runs-on: ubuntu-latest

    container:
      image: rust:1-bookworm

    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Upload application binary
        uses: actions/upload-artifact@v7
        with:
          name: application
          path: target/release/ansible-operator
          if-no-files-found: error

  # Build and push the container image from the prebuilt binary. Gated to the same events
  # as `compile`, so it never runs (or pushes) on PRs or plain main pushes.
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [compile]

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when signing release tags.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download application binary
        uses: actions/download-artifact@v8
        with:
          name: application
          path: target/release/

      # Install the cosign tool only for real releases (signing is release-only).
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2
        with:
          cosign-release: "v2.2.4"

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: Containerfile
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Sign the resulting Docker image digest but only for tags.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"

  # Publish the chart only after the matching operator image is available. Helm uses
  # appVersion as the default image tag, so publishing them independently would create
  # chart versions that cannot be installed with their defaults.
  publish-chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, chart]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_VERSION#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          chart_version="$(grep -m1 '^version:' chart/Chart.yaml | cut -d ' ' -f 2)"
          chart_app_version="$(grep -m1 '^appVersion:' chart/Chart.yaml | cut -d ' ' -f 2 | tr -d '"')"

          if [[ "$cargo_version" != "$release_version" || \
                "$chart_version" != "$release_version" || \
                "$chart_app_version" != "$release_version" ]]; then
            echo "Release tag, Cargo package and Helm chart versions must match" >&2
            echo "tag=$release_version cargo=$cargo_version chart=$chart_version appVersion=$chart_app_version" >&2
            exit 1
          fi

      - name: Log into GHCR for Helm
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package and publish Helm chart
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          release_version="${RELEASE_VERSION#v}"
          repository_owner="${REPOSITORY_OWNER,,}"

          mkdir -p dist
          helm package chart --destination dist
          helm push "dist/ansible-operator-${release_version}.tgz" \
            "oci://ghcr.io/${repository_owner}/charts"
