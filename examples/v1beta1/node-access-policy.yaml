apiVersion: ansible.cloudbending.dev/v1beta1
kind: NodeAccessPolicy
# NodeAccessPolicy is cluster-scoped — no namespace. Creating one requires cluster-level RBAC, so
# only cluster admins can author policies.
metadata:
  name: business-team
spec:
  # Grant to a single namespace by its auto-stamped name label. Use matchExpressions here to cover
  # several namespaces at once, e.g. { key: team, operator: In, values: [business, payments] }.
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: business-app
  # The ceiling: these namespaces' ClusterInventories may only resolve nodes in the "business" pool.
  nodeSelector:
    matchExpressions:
      - { key: node-pool, operator: In, values: [business] }
---
apiVersion: ansible.cloudbending.dev/v1beta1
kind: NodeAccessPolicy
metadata:
  name: cluster-admins
spec:
  # The admins' own plan namespace may target every node. It is a tenant namespace like any other
  # (enrolled through the chart's watchNamespaces), not the operator's namespace: the policy applies
  # to the namespace a plan lives in, and plans do not belong in the operator's. Note there is no
  # "match all" shortcut — an empty selector matches nothing (fail-closed), so allow-all is
  # expressed explicitly by matching a label every node carries.
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: platform-admin
  nodeSelector:
    matchExpressions:
      - { key: kubernetes.io/hostname, operator: Exists }
