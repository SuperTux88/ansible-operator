{{- /*
Namespaced permissions, rendered once per ENROLLED namespace = the operator's own namespace
(.Release.Namespace, always enrolled) plus every entry in .Values.watchNamespaces. This is the R1
enforcement boundary: the operator can read/write Secrets and create Jobs ONLY in these namespaces.

Every enrolled namespace gets the "plan-serving" rules (Secret/Job/Pod access for a run). The
operator's OWN namespace additionally gets the managed-ssh infra rules (Leases, proxy pods, proxy
NetworkPolicies, and cleanup of per-run cert Secrets) — those resources only ever exist there. Per-run
playbook NetworkPolicies are created in the plan namespace when enabled.
*/ -}}
{{- $namespaces := concat (.Values.watchNamespaces | default list) (list .Release.Namespace) | uniq }}
{{- range $ns := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chart.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "chart.labels" $ | nindent 4 }}
rules:
  # Plan-serving grants (R1) — scoped to enrolled namespaces only:
  #  - the workspace Secret is created/patched here and variable/file Secrets are read here;
  #  - the per-run managed-ssh client-cert Secret is created here (the Job pod mounts it, and pods
  #    can only mount Secrets from their own namespace) and deleted here at run completion, so
  #    `delete` is required in every enrolled namespace, not just the operator's;
  #  - one Job per run is created + watched here;
  #  - the run's Job-owned pod is read here for its termination message;
  #  - one immutable Play recovery/history record per run attempt is created, status-updated,
  #    listed, and deleted here (it is owned by its PlaybookPlan in the same namespace, so it
  #    cascades on plan deletion). The PlaybookPlan controller reads these records during recovery.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # `delete` is used for cancellation only: a plan deleted mid-run has its Job cancelled explicitly
  # rather than left to the deleting client's propagation policy, which may orphan the pod. Finished
  # Jobs are still reaped by their TTL, not by the operator. The operator deletes only a Job whose
  # identity it has validated, but that is its own restraint: RBAC cannot scope `delete` to Jobs the
  # operator created, so the grant covers every Job in an enrolled namespace.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # `patch` on the plans themselves exists for the run-cleanup finalizer: a run's proxy pods and host
  # Leases live in the operator's namespace, where an OwnerReference cannot reach them, so a plan
  # deleted mid-run must be held open until the operator has released them. The finalizer is the only
  # thing the operator patches here, but that is a property of the code, not of the grant — RBAC
  # cannot restrict `patch` to `metadata.finalizers`, so this permits writing the spec and metadata
  # of any plan in an enrolled namespace, and the privilege summary in THREAT_MODEL.md counts it as
  # such. Deliberately here and NOT in the ClusterRole, which stays read-only: the operator can write
  # plan objects only in namespaces it is already trusted to run them in. Un-enrolling a namespace
  # with a run in flight therefore leaves a finalizer the operator can no longer remove — see the
  # deployment docs.
  - apiGroups: ["ansible.cloudbending.dev"]
    resources: ["playbookplans"]
    verbs: ["patch"]
  - apiGroups: ["ansible.cloudbending.dev"]
    resources: ["plays"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["ansible.cloudbending.dev"]
    resources: ["plays/status"]
    verbs: ["get", "update", "patch"]
  # `delete` remains available even when optional egress policies are disabled so policies from a
  # previous enabled configuration can still be cleaned up safely.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs:
      - delete
      {{- if or $.Values.networkPolicy.enabled (eq $ns $.Release.Namespace) }}
      - create
      - patch
      {{- end }}
      {{- if eq $ns $.Release.Namespace }}
      - list
      - watch
      - deletecollection
      {{- end }}
  {{- if eq $ns $.Release.Namespace }}
  # Operator-namespace-only infra. Leases, managed-ssh proxy pods, their NetworkPolicies, and
  # cleanup (delete/deletecollection) of per-run cert Secrets only ever exist in the operator's own
  # namespace, so these are NOT granted in tenant namespaces. Playbook NetworkPolicies use the
  # plan-namespace rule above.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["delete", "deletecollection"]
  {{- end }}
{{- end }}
