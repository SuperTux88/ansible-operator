# Default values for the ansible-operator chart.

crds:
  install: true
  # Unlike Helm's install-only crds/ directory, subchart templates are release resources and are
  # deleted on `helm uninstall` — which would cascade to every PlaybookPlan, Play, ClusterInventory,
  # StaticInventory and NodeAccessPolicy in the cluster. `keep` annotates them with
  # helm.sh/resource-policy: keep so an uninstall leaves both the definitions and the resources
  # alone; they then have to be deleted manually. Upgrades reconcile schema changes either way.
  keep: true

replicaCount: 1

image:
  repository: ghcr.io/webd97/ansible-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

managedSsh:
  proxyImage:
    repository: ghcr.io/webd97/ansible-operator-sshd@sha256:bd32bc1aaf89d110a5e5098977c5b41018c9134eef57d9ec14c42ac3fb959f38
    # <openssh>-<revision>, e.g. 10.4p1-1; the release workflow repins this to a @sha256: digest.
    tag: ""

  # How long the operator waits for a NotReady node's managed-ssh proxy pod to become Ready before it
  # gives up on that node for the run (Ansible then reports the node unreachable, and it is retried on
  # the next run). The wait covers pods stuck before Running and old-credential pods still
  # terminating after a reset; a pod that has reached Running normally is waited on until Ready as
  # usual. The wait scales with how long the node has been silent: it is
  # `graceSeconds` for a node whose last heartbeat is within `thresholdDays[0]`, divided by
  # `aggressiveness` again at each further threshold, and 0 (given up immediately) past the last one.
  # Defaults give 600 / 300 / 150 / 0 seconds at 3 / 7 / 30 day boundaries.
  readiness:
    graceSeconds: 600
    aggressiveness: 2
    thresholdDays: [3, 7, 30]

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Enrolled tenant namespaces (R1 / THREAT_MODEL T-INFO-1). The operator may read/write Secrets and
# create Jobs ONLY in these namespaces plus its own (.Release.Namespace, always enrolled). This is
# the security boundary that replaces the old cluster-wide Secret/Job/Pod grants — an operator
# compromise is bounded to the enrolled namespaces, not the whole cluster.
#
# Fail-closed: a PlaybookPlan created in a namespace NOT listed here (and not the operator namespace)
# is refused with status.phase = UnauthorizedNamespace. There is deliberately no "all namespaces"
# escape hatch. Enrolling a namespace is an admin action: edit this list and `helm upgrade` (which
# rolls the operator so it re-reads the enrollment config).
#
# Example:
#   watchNamespaces:
#     - team-a
#     - team-b
watchNamespaces: []

# IMPORTANT: install this chart into its own dedicated namespace, e.g.:
#   helm install --create-namespace -n ansible-system ansible-operator ./chart
# All namespaced resources in this chart (Deployment, ServiceAccount, Role/RoleBinding) use
# .Release.Namespace. That namespace is also where per-run Leases, managed-ssh proxy
# pods/Secrets/NetworkPolicies live at runtime — never the namespace a PlaybookPlan happens to
# be created in. (The operator's SSH CA is in-memory only) Keeping this separate means only this
# one namespace needs privileged-pod exceptions (Pod Security Admission), not every tenant namespace.

serviceAccount:
  create: true
  # Disable implicit token mounts on the ServiceAccount. The operator Deployment requests its API
  # token explicitly, so this does not change the operator's runtime access.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  # The operator's own pod needs no special privilege — it never touches node filesystems
  # itself, only the ephemeral managed-ssh proxy pods it creates do.
  allowPrivilegeEscalation: false

# Node labels a PlaybookPlan publishes for other plans to depend on.
#
# A plan that sets `spec.provides` labels every Node it converged with
# `<namespace>.plan.ansible.cloudbending.dev/<plan-name>: <version>`, and another plan's
# ClusterInventory can select on that label so its own runs only reach hosts the first plan has
# finished with. Ordinary workloads can use the same label in nodeAffinity.
nodeLabels:
  # Grants the operator `patch` on Nodes and turns the feature on. Set to false if the operator must
  # not write to Node objects at all: plans with `spec.provides` still run, and report in their
  # status that node labels are disabled on this cluster, so a plan waiting on one of them says why.
  #
  # Turning it off also takes away the permission to REMOVE labels already written. Nothing removes
  # them: the operator only logs labels whose plan no longer exists, and a plan that still exists
  # reports the Nodes still carrying its label in its `ProvidesLabels` condition. Remove a label with
  # `kubectl label nodes -l '<key>' '<key>-'`.
  enabled: true
  # Renders a ValidatingAdmissionPolicy that holds the operator's `patch` on Nodes to exactly those
  # labels — every other label, and everything outside metadata.labels, must be unchanged. It
  # applies only to requests from the operator's own ServiceAccount, so it never constrains an
  # administrator.
  #
  # ValidatingAdmissionPolicy is generally available from Kubernetes 1.30, while this chart supports
  # 1.25 and up. On an older cluster set this to false: the feature keeps working and the permission
  # is simply unguarded. The install fails loudly ("no matches for kind ValidatingAdmissionPolicy")
  # rather than the guard being dropped silently, which is why this is an explicit choice and not a
  # `.Capabilities.APIVersions.Has` check — `helm template` without `--api-versions` reports the API
  # as missing, so a rendering pipeline would quietly ship the permission without its guard.
  admissionPolicy: true

# Optional egress NetworkPolicies. Rules use the native networking.k8s.io/v1 NetworkPolicy egress
# schema. Disabled by default so an upgrade never broadens or changes existing network controls.
#
# CAUTION: these are raw NetworkPolicy egress rule arrays, so empty-vs-unrestricted follows
# NetworkPolicy semantics, not Helm's:
#   - `[{}]` (the operator and playbook defaults below) — policy present, egress unrestricted. Safe
#     to enable as-is; it changes nothing about connectivity and gives you an object to add rules to.
#   - `[]`   — policy present with NO rules, which in NetworkPolicy semantics is DENY ALL egress.
#     This is the managed-ssh default because the proxy only needs inbound SSH; for the operator it
#     would block the API server and DNS, and for playbook Jobs it would block their targets. Set it
#     deliberately for those workloads.
# Replace the defaults with an explicit allowlist to actually restrict egress.
networkPolicy:
  enabled: false
  operator:
    egress: [{}]
  playbook:
    egress: [{}]
  managedSsh:
    egress: []

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user.
  # limits:
  #   cpu: 200m
  #   memory: 128Mi
  # requests:
  #   cpu: 50m
  #   memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
