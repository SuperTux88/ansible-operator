apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  {{- if .Values.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  name: staticinventories.ansible.cloudbending.dev
spec:
  group: ansible.cloudbending.dev
  names:
    kind: StaticInventory
    plural: staticinventories
    singular: staticinventory
  scope: Namespaced
  versions:
  - name: v1beta1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for StaticInventorySpec via `CustomResource`
        properties:
          spec:
            properties:
              hosts:
                items:
                  description: |-
                    One named group of external hosts, optionally carrying group variables applied to every host
                    in the group.
                  properties:
                    hosts:
                      items:
                        type: string
                      type: array
                    name:
                      type: string
                    variables:
                      description: |-
                        Group variables applied to every host in this group, rendered as Ansible group `vars:`,
                        e.g. `ansible_python_interpreter`. The connection variables the operator manages are
                        rejected: `ansible_host`, `ansible_port` and `ansible_user`, also as `ansible_ssh_host`,
                        `ansible_ssh_port` and `ansible_ssh_user`, `ansible_ssh_private_key_file` and
                        `ansible_ssh_common_args`.
                      nullable: true
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - hosts
                  - name
                  type: object
                type: array
              ssh:
                description: |-
                  How to reach these hosts over SSH. Mandatory: a StaticInventory with no reachability
                  info isn't usable by any PlaybookPlan.
                properties:
                  port:
                    description: The TCP port the hosts' SSH server listens on. Omit it for SSH's default, 22.
                    maximum: 65535.0
                    minimum: 1.0
                    nullable: true
                    type: integer
                  secretRef:
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  user:
                    type: string
                required:
                - secretRef
                - user
                type: object
            required:
            - hosts
            - ssh
            type: object
        required:
        - spec
        title: StaticInventory
        type: object
    served: true
    storage: true
