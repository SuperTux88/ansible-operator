apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  {{- if .Values.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  name: clusterinventories.ansible.cloudbending.dev
spec:
  group: ansible.cloudbending.dev
  names:
    kind: ClusterInventory
    plural: clusterinventories
    singular: clusterinventory
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.hostCount
      name: Hosts
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ClusterInventorySpec via `CustomResource`
        properties:
          spec:
            properties:
              hosts:
                items:
                  properties:
                    matchExpressions:
                      items:
                        properties:
                          key:
                            type: string
                          operator:
                            description: |-
                              How a `matchExpressions` term compares a label against the values it lists.

                              `In`, `NotIn`, `Exists` and `DoesNotExist` behave exactly as Kubernetes' own label selectors do.

                              `Gt`, `Ge`, `Lt` and `Le` order the label value against the term's single value **as a version**,
                              which Kubernetes itself cannot do: its own `Gt`/`Lt` parse both sides as integers, so a dotted
                              version never matches, and plain string ordering would sort 1.10.0 before 1.9.0. An optional
                              leading `v` is accepted, missing components are read as `0` (so `1.4` is `1.4.0` and an integer
                              is a one-component version, comparing exactly as Kubernetes would compare it), a pre-release
                              sorts before its release (`Ge 1.4.0` excludes `1.4.0-rc.1`), and build metadata after `+` or `_`
                              is ignored. A comparison that cannot be answered matches nothing: no such label on the object,
                              anything other than exactly one value listed, or either side not a version.
                            enum:
                            - In
                            - NotIn
                            - Exists
                            - DoesNotExist
                            - Gt
                            - Ge
                            - Lt
                            - Le
                            type: string
                          values:
                            items:
                              type: string
                            nullable: true
                            type: array
                        required:
                        - key
                        - operator
                        type: object
                      nullable: true
                      type: array
                    matchLabels:
                      additionalProperties:
                        type: string
                      nullable: true
                      type: object
                    name:
                      type: string
                    variables:
                      description: |-
                        Group variables applied to every node this group resolves to, rendered as Ansible group
                        `vars:`. Use it to set node facts the playbook author should not have to know, e.g.
                        `ansible_python_interpreter`. Operator-managed connection variables (`ansible_host`,
                        `ansible_user`, `ansible_port`, `ansible_ssh_*`) are rejected — the operator owns those.
                      nullable: true
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - name
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                type: array
              tolerations:
                description: |-
                  Tolerations applied to the managed-ssh proxy pods created for this inventory's hosts,
                  e.g. to allow scheduling onto tainted controlplane nodes.
                items:
                  properties:
                    effect:
                      nullable: true
                      type: string
                    key:
                      nullable: true
                      type: string
                    operator:
                      nullable: true
                      type: string
                    toleration_seconds:
                      format: int64
                      nullable: true
                      type: integer
                    value:
                      nullable: true
                      type: string
                  type: object
                nullable: true
                type: array
            required:
            - hosts
            type: object
          status:
            nullable: true
            properties:
              hostCount:
                description: |-
                  How many distinct Nodes this inventory resolves to — the `Hosts` column. A Node matched by
                  two of the inventory's groups is listed in both of `resolvedHosts` and counted here once,
                  because that is what it is to a run: one host, applied to once. The plan's own `n/m hosts`
                  summaries and a `Play`'s `Hosts` column count the same way, and they are read side by side.
                format: uint
                minimum: 0.0
                type: integer
              observedGeneration:
                description: |-
                  The `metadata.generation` this status was computed from.

                  `resolvedHosts` is a *published* answer rather than a live one — a plan reads it instead of
                  evaluating the selectors itself — so between a spec edit and this controller's next reconcile
                  the published hosts still describe the previous spec. A plan that started a run in that
                  window would target the old host set, which one `helm upgrade` changing an inventory and a
                  plan together makes routine: Helm applies both in a single pass and waits for no status.

                  A plan therefore prepares no new run from an inventory whose `observedGeneration` is not its
                  `metadata.generation`, and the status write that catches it up wakes every plan that names
                  it. Absent until this controller has written a status at all.
                format: int64
                nullable: true
                type: integer
              resolvedHosts:
                description: |-
                  The Nodes each group resolved to, with their group membership preserved — a Node in two
                  groups appears in both, which is what makes the rendered Ansible inventory's groups mean
                  something.
                items:
                  properties:
                    hosts:
                      items:
                        type: string
                      type: array
                    name:
                      type: string
                  required:
                  - hosts
                  - name
                  type: object
                type: array
            required:
            - hostCount
            - resolvedHosts
            type: object
        required:
        - spec
        title: ClusterInventory
        type: object
    served: true
    storage: true
    subresources:
      status: {}
