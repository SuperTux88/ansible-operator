apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  {{- if .Values.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  name: plays.ansible.cloudbending.dev
spec:
  group: ansible.cloudbending.dev
  names:
    kind: Play
    plural: plays
    singular: play
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.playbookPlan
      name: Plan
      type: string
    - jsonPath: .spec.runNumber
      name: Run
      priority: 1
      type: integer
    - jsonPath: .spec.attempt
      name: Try
      priority: 1
      type: integer
    - jsonPath: .status.hostCount
      name: Hosts
      type: integer
    - jsonPath: .status.recap.ok
      name: Ok
      type: integer
    - jsonPath: .status.recap.changed
      name: Changed
      type: integer
    - jsonPath: .status.recap.failed
      name: Failed
      type: integer
    - jsonPath: .status.recap.unreachable
      name: Unreachable
      type: integer
    - jsonPath: .status.recap.rescued
      name: Rescued
      priority: 1
      type: integer
    - jsonPath: .status.recap.skipped
      name: Skipped
      priority: 1
      type: integer
    - jsonPath: .status.recap.ignored
      name: Ignored
      priority: 1
      type: integer
    - jsonPath: .status.phase
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for PlaySpec via `CustomResource`
        properties:
          spec:
            description: |-
              An immutable per-run recovery and history record. It is written before Job creation, advances
              from preparation through execution, and retains the terminal recap after the Job is reaped.

              Owned (ownerReference) by its `PlaybookPlan`, so deleting the plan cascades to all its Plays;
              retention beyond that is bounded per-plan by `successfulPlaysHistoryLimit`/
              `failedPlaysHistoryLimit`. The Job and pod template carry this Play's UID for correlation.
            properties:
              attempt:
                description: |-
                  Which try of its execution this run is: 1 for the first, one more for each retry of a failed
                  one, up to the plan's `spec.maxAttempts`. An execution is the current playbook and inputs
                  for a `OneShot` plan and one schedule tick for a `Recurring` one, so this restarts at 1
                  whenever the plan is edited, after a successful `OneShot` execution, and — for `Recurring` —
                  at every tick.

                  Orthogonal to `runNumber`, which every try advances because every try *is* a run — with its
                  own record, its own `runId` and its own Job. This says which try of its execution that run
                  was, which the run number cannot: it is reserved plan-wide and continues across editions.
                minimum: 0.0
                type: integer
              executionHash:
                description: The execution hash the run applied — matches the backing Job's hash label.
                type: string
              inventory:
                description: |-
                  The inventory this run targeted, preserving the groups the user designed (each group's name
                  and its hosts) rather than a flat host list. Same shape as the plan's `.status.eligibleHosts`,
                  filtered to the hosts this run actually ran.
                items:
                  properties:
                    hosts:
                      items:
                        type: string
                      type: array
                    name:
                      type: string
                  required:
                  - hosts
                  - name
                  type: object
                type: array
              playbookPlan:
                description: The `PlaybookPlan` this run belongs to (also this Play's ownerReference).
                type: string
              playbookPlanUid:
                description: |-
                  UID of the owning `PlaybookPlan`. Unlike an ownerReference, this is part of the immutable run
                  record and prevents a plan recreated with the same name from adopting an older run.
                type: string
              preparationFingerprint:
                description: |-
                  Fingerprint of all plan and resolved-inventory inputs used while preparing this run.

                  This is the run's change detector, and it is why the record carries no copy of the plan spec,
                  resolved connection configuration or the Job. Everything an unlaunched run needs to be
                  resumed is a pure function of the live plan spec and the freshly resolved groups, so while
                  the fingerprint still matches those the inputs can simply be re-derived; once it stops
                  matching there is nothing worth resuming and the run is aborted in favour of the new
                  revision. Reducing them to one *typed* field is also what lets the spec's `self == oldSelf`
                  rule cover the whole record: CEL cannot see into a schemaless field, and there is none here.
                type: string
              providesVersion:
                description: |-
                  The version this run's revision declared in the plan's `spec.provides`, if it declared one.

                  Recorded here rather than read from the live plan when a result is folded in, because the
                  two can legitimately differ: a plan edited while a run was in flight already advertises the
                  *next* version, and stamping that onto the hosts this run converged would label them for a
                  revision they never received. The run's own record is the only copy that still describes
                  what actually ran.

                  Absent for a plan that provides nothing, and absent on every record written before this
                  field existed — no Node is ever labelled from such a record.
                nullable: true
                type: string
              runId:
                description: |-
                  Stable identifier for this run, used to isolate resource names, labels, and cleanup from
                  other runs that share the same execution hash.
                type: string
              runNumber:
                description: |-
                  Sequence number reserved across all revisions of this plan: 1 for the first run, then one
                  past every Job and retained `Play` record still claiming a number. It therefore continues
                  across plan edits rather than restarting at 1 for a new revision. Mirrors the backing Job's
                  numbered name (`apply-{plan}-{shortid}-{runNumber}`).

                  Not a dense count of this plan's runs: a run abandoned before its Job exists leaves its
                  number unused whenever the plan's `lastRunNumber` already recorded it. Uniqueness of the
                  name is the whole contract.
                minimum: 0.0
                type: integer
              triggeredSlot:
                description: |-
                  Start of the schedule slot consumed by this run. Unscheduled runs leave this absent. Keeping
                  it in the immutable run record lets restart recovery distinguish this run's slot from a later
                  slot that becomes due while the operator is unavailable.
                nullable: true
                type: string
            required:
            - attempt
            - executionHash
            - inventory
            - playbookPlan
            - playbookPlanUid
            - preparationFingerprint
            - runId
            - runNumber
            type: object
            x-kubernetes-validations:
            - message: Play spec is immutable
              rule: self == oldSelf
          status:
            nullable: true
            properties:
              failedHostCount:
                description: How many targeted hosts did not end `Succeeded`.
                minimum: 0.0
                type: integer
              finishedAt:
                description: |-
                  When the backing Job reached a terminal state. The run's *start* is the Play's own
                  `metadata.creationTimestamp` (the Play is created immediately before the run's Job), so it
                  isn't duplicated here. See the `#[serde(default, ...)]` timestamp note on
                  `PlaybookPlanStatus::next_run`: merge patches drop `null` keys, so this is genuinely absent
                  when `None`.
                nullable: true
                type: string
              hostCount:
                description: |-
                  Number of distinct hosts this run targeted (the total across `spec.inventory`, surfaced as
                  a column).
                minimum: 0.0
                type: integer
              hosts:
                additionalProperties:
                  properties:
                    outcome:
                      enum:
                      - Succeeded
                      - Unknown
                      - Failed
                      - Unreachable
                      - NotReached
                      - Incomplete
                      type: string
                    recap:
                      description: |-
                        The seven Ansible recap counters (`PLAY RECAP` line). Field order is irrelevant here — unlike
                        the positional wire format in `callback_output::HostStats`, these are named/`camelCase` for
                        JSONPath columns and merge-patch friendliness.
                      properties:
                        changed:
                          minimum: 0.0
                          type: integer
                        failed:
                          minimum: 0.0
                          type: integer
                        ignored:
                          minimum: 0.0
                          type: integer
                        ok:
                          minimum: 0.0
                          type: integer
                        rescued:
                          minimum: 0.0
                          type: integer
                        skipped:
                          minimum: 0.0
                          type: integer
                        unreachable:
                          minimum: 0.0
                          type: integer
                      required:
                      - changed
                      - failed
                      - ignored
                      - ok
                      - rescued
                      - skipped
                      - unreachable
                      type: object
                  required:
                  - outcome
                  - recap
                  type: object
                description: Per-host recap and outcome, for drilling into which host did what.
                type: object
              jobName:
                description: |-
                  Name of the backing Job in the plan's namespace. The Job/pod may already have been reaped by
                  Kubernetes' TTL controller; this Play outlives them.
                nullable: true
                type: string
              phase:
                enum:
                - Prepared
                - Starting
                - Launching
                - Running
                - Succeeded
                - Failed
                - Unknown
                - Aborted
                type: string
              planStatusRecorded:
                default: false
                description: |-
                  Whether this terminal result has been applied to the owning `PlaybookPlan` status. Kept on
                  the status subresource so acknowledgement uses the operator's existing `plays/status` RBAC.
                type: boolean
              recap:
                description: The Ansible recap, summed across every targeted host — the recap columns read from here.
                properties:
                  changed:
                    minimum: 0.0
                    type: integer
                  failed:
                    minimum: 0.0
                    type: integer
                  ignored:
                    minimum: 0.0
                    type: integer
                  ok:
                    minimum: 0.0
                    type: integer
                  rescued:
                    minimum: 0.0
                    type: integer
                  skipped:
                    minimum: 0.0
                    type: integer
                  unreachable:
                    minimum: 0.0
                    type: integer
                required:
                - changed
                - failed
                - ignored
                - ok
                - rescued
                - skipped
                - unreachable
                type: object
              unreachableHosts:
                default: []
                description: |-
                  The managed-ssh hosts this run excluded from execution: their proxy pod never became Ready
                  within the grace window, so there was no address to reach them at and the run passed
                  `--limit '!<host>'` rather than dialling one. They stay in the rendered inventory, so
                  `groups[]` still describes the full fleet.

                  Their outcome in `hosts` follows `nodeNotReady`: `Unreachable` when the Node itself was down,
                  `NotReached` when the Node was `Ready` and only its proxy pod failed. The two are recovered
                  from in different places, and only the first is something a Node returning to `Ready` fixes.

                  Written at the launch commit, because neither half is knowable later: the recap says nothing
                  about a host it never processed, and the Node's own state cannot be re-read afterwards
                  because by then it may have recovered.

                  A run whose Job creation did not complete is resumed, re-reads its proxy pods and re-states
                  this from what it finds, so that the record and the `--limit` file the same tick renders
                  always describe one run. That still makes it "at launch": a run whose Job exists is adopted
                  rather than resumed, so the last write is always the one immediately before the Job that ran.
                items:
                  description: |-
                    A host excluded from a run, and the one distinction the exclusion itself does not carry.

                    Both kinds are equally unreachable and are excluded identically, but they mean opposite things:
                    a Node that was down is something no attempt could have helped with and that its own return
                    resolves, while a `Ready` Node whose proxy pod never came up anyway — an untolerated taint, a
                    failing image pull, a rejecting admission webhook — is a configuration problem that no Node event
                    will ever resolve. Only the first is refunded an attempt, only the first is reported
                    `Unreachable` (the second reads `NotReached`), and only the first keeps the host in the Node
                    watch's wake set.
                  properties:
                    host:
                      type: string
                    nodeNotReady:
                      description: The `Node` backing this host was itself not reporting `Ready` when the run launched.
                      type: boolean
                  required:
                  - host
                  - nodeNotReady
                  type: object
                type: array
            required:
            - failedHostCount
            - hostCount
            - hosts
            - phase
            - recap
            type: object
        required:
        - spec
        title: Play
        type: object
    served: true
    storage: true
    subresources:
      status: {}
