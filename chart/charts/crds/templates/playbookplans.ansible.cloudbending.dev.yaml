apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  {{- if .Values.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  name: playbookplans.ansible.cloudbending.dev
spec:
  group: ansible.cloudbending.dev
  names:
    kind: PlaybookPlan
    plural: playbookplans
    singular: playbookplan
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .status.lastTriggeredRun
      name: Previous run
      type: string
    - jsonPath: .status.nextRun
      name: Next run
      type: string
    - jsonPath: .status.currentHash
      name: Current hash
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Running")].status
      name: Running
      type: string
    - jsonPath: .status.summary
      name: Summary
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for PlaybookPlanSpec via `CustomResource`
        properties:
          spec:
            properties:
              failedPlaysHistoryLimit:
                description: |-
                  How many failed (or outcome-unknown) `Play` history records to keep for this plan. Kept
                  larger than the successful limit so failures stay visible longer. A terminal result is
                  temporarily exempt until it reaches the plan status; an aborted run is deleted only
                  after its resources are cleaned up. Defaults to 10.
                minimum: 0.0
                nullable: true
                type: integer
              image:
                description: An OCI image with Ansible and all required collections
                type: string
              inventoryRefs:
                description: These host groups will be available in our playbook
                items:
                  properties:
                    clusterInventory:
                      description: Name of the ClusterInventory resource being referenced
                      nullable: true
                      type: string
                    staticInventory:
                      description: Name of the StaticInventory resource being referenced
                      nullable: true
                      type: string
                  type: object
                type: array
              maxAttempts:
                description: |-
                  How many times a failed run may be tried again before the operator stops, counting the first
                  run — so `1` means no retry. Defaults to 3 for `OneShot` and 1 for `Recurring`.

                  The budget covers one *execution*: for `OneShot` the current playbook and inputs, which an
                  edit resets; for `Recurring` one schedule tick, since the next tick is going to re-apply the
                  playbook anyway. Every try is a run of its own, with its own `Play` record and its own Job.
                minimum: 1.0
                nullable: true
                type: integer
              mode:
                default: OneShot
                description: Controls if a playbook is executed once or repeatedly
                enum:
                - OneShot
                - Recurring
                type: string
              schedule:
                description: |-
                  5-field cron expression (`minute hour day-of-month month day-of-week`) that tells at which
                  time the playbook may execute.
                nullable: true
                pattern: ^[0-9*/,-]+[ \t]+[0-9*/,-]+[ \t]+[0-9?*/,-]+[ \t]+[0-9A-Za-z*/,-]+[ \t]+[0-9A-Za-z?*/,-]+$
                type: string
              securityContext:
                description: |-
                  Container security context applied to both the Ansible playbook container and the optional
                  collection-installer init container. Optional for compatibility with arbitrary execution
                  images; cluster admission policies may require particular fields.
                nullable: true
                properties:
                  allowPrivilegeEscalation:
                    nullable: true
                    type: boolean
                  appArmorProfile:
                    nullable: true
                    properties:
                      localhostProfile:
                        nullable: true
                        type: string
                      type:
                        type: string
                    required:
                    - type
                    type: object
                  capabilities:
                    nullable: true
                    properties:
                      add:
                        items:
                          type: string
                        nullable: true
                        type: array
                      drop:
                        items:
                          type: string
                        nullable: true
                        type: array
                    type: object
                  privileged:
                    nullable: true
                    type: boolean
                  procMount:
                    nullable: true
                    type: string
                  readOnlyRootFilesystem:
                    nullable: true
                    type: boolean
                  runAsGroup:
                    format: int64
                    nullable: true
                    type: integer
                  runAsNonRoot:
                    nullable: true
                    type: boolean
                  runAsUser:
                    format: int64
                    nullable: true
                    type: integer
                  seLinuxOptions:
                    nullable: true
                    properties:
                      level:
                        nullable: true
                        type: string
                      role:
                        nullable: true
                        type: string
                      type:
                        nullable: true
                        type: string
                      user:
                        nullable: true
                        type: string
                    type: object
                  seccompProfile:
                    nullable: true
                    properties:
                      localhostProfile:
                        nullable: true
                        type: string
                      type:
                        type: string
                    required:
                    - type
                    type: object
                  windowsOptions:
                    nullable: true
                    properties:
                      gmsaCredentialSpec:
                        nullable: true
                        type: string
                      gmsaCredentialSpecName:
                        nullable: true
                        type: string
                      hostProcess:
                        nullable: true
                        type: boolean
                      runAsUserName:
                        nullable: true
                        type: string
                    type: object
                type: object
              serviceAccountName:
                description: |-
                  ServiceAccount the playbook pod runs as, letting tasks reach the Kubernetes API with that
                  identity's RBAC. When set, the SA's token is auto-mounted (Ansible's `kubernetes.core`
                  modules pick it up via in-cluster config). When unset, the pod runs with no API token at
                  all — create the ServiceAccount and its Role/RoleBinding yourself and name it here.
                nullable: true
                type: string
              startingDeadlineSeconds:
                description: |-
                  Grace window, in seconds, after a scheduled tick during which a run may still start. The
                  operator evaluates the schedule on a requeue rather than exactly on the tick, so this
                  absorbs the gap between a tick and the next reconcile (e.g. the operator was busy or
                  restarting). If more than this many seconds pass past a tick without the run starting, that
                  tick is skipped and the run waits for the next one. The same idea as a CronJob's
                  `.spec.startingDeadlineSeconds`. A `Recurring` retry shares the original tick's deadline; the
                  window does not restart when an attempt fails, so time spent running earlier attempts counts
                  against it. Only affects scheduled (`schedule`) plans. Defaults to 30.
                minimum: 0.0
                nullable: true
                type: integer
              successfulPlaysHistoryLimit:
                description: |-
                  How many successful `Play` history records to keep for this plan before the oldest are
                  pruned. Unlike the Job's short TTL, Plays are the durable run history. A terminal result is
                  temporarily exempt until it reaches the plan status. Defaults to 3.
                minimum: 0.0
                nullable: true
                type: integer
              suspend:
                default: false
                description: |-
                  When true, the operator stops starting new runs for this plan — the same idea as a
                  CronJob's `.spec.suspend`. A run already in progress is left to finish; only the *starting*
                  of new runs is gated. While suspended the `Suspended` printer column reads `true` and
                  `.status.nextRun` is cleared; the plan's phase keeps reflecting its underlying state.
                  Defaults to false.
                type: boolean
              template:
                description: The playbook will be built from this, some fields will be set automatically (vars, hosts)
                properties:
                  files:
                    description: Files for the playbook
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    nullable: true
                    type: array
                  playbook:
                    description: The actual playbook contents
                    type: string
                  requirements:
                    description: Runtime requirements (e.g. Ansible collections)
                    nullable: true
                    type: string
                  variables:
                    description: Variables for the playbook
                    items:
                      anyOf:
                      - required:
                        - secretRef
                      - required:
                        - inline
                      properties:
                        inline:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        secretRef:
                          properties:
                            name:
                              type: string
                          required:
                          - name
                          type: object
                      type: object
                    nullable: true
                    type: array
                required:
                - playbook
                type: object
              timeZone:
                description: IANA time zone for the `schedule` field, if unset UTC is assumed.
                enum:
                - Africa/Abidjan
