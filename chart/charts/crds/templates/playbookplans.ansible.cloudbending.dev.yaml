apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  {{- if .Values.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  name: playbookplans.ansible.cloudbending.dev
spec:
  group: ansible.cloudbending.dev
  names:
    kind: PlaybookPlan
    plural: playbookplans
    singular: playbookplan
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .status.lastTriggeredRun
      name: Previous run
      type: string
    - jsonPath: .status.nextRun
      name: Next run
      type: string
    - jsonPath: .status.currentHash
      name: Current hash
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Running")].status
      name: Running
      type: string
    - jsonPath: .status.summary
      name: Summary
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for PlaybookPlanSpec via `CustomResource`
        properties:
          spec:
            properties:
              failedPlaysHistoryLimit:
                description: |-
                  How many failed (or outcome-unknown) `Play` history records to keep for this plan. Kept
                  larger than the successful limit so failures stay visible longer. A terminal result is
                  temporarily exempt until it reaches the plan status; an aborted attempt is deleted only
                  after its resources are cleaned up. Defaults to 10.
                minimum: 0.0
                nullable: true
                type: integer
              image:
                description: An OCI image with Ansible and all required collections
                type: string
              inventoryRefs:
                description: These host groups will be available in our playbook
                items:
                  properties:
                    clusterInventory:
                      description: Name of the ClusterInventory resource being referenced
                      nullable: true
                      type: string
                    staticInventory:
                      description: Name of the StaticInventory resource being referenced
                      nullable: true
                      type: string
                  type: object
                type: array
              mode:
                default: OneShot
                description: Controls if a playbook is executed once or repeatedly
                enum:
                - OneShot
                - Recurring
                type: string
              schedule:
                description: 5-part cron expression that tells at which time the playbook may execute
                nullable: true
                type: string
              securityContext:
                description: |-
                  Container security context applied to both the Ansible playbook container and the optional
                  collection-installer init container. Optional for compatibility with arbitrary execution
                  images; cluster admission policies may require particular fields.
                nullable: true
                properties:
                  allowPrivilegeEscalation:
                    nullable: true
                    type: boolean
                  appArmorProfile:
                    nullable: true
                    properties:
                      localhostProfile:
                        nullable: true
                        type: string
                      type:
                        type: string
                    required:
                    - type
                    type: object
                  capabilities:
                    nullable: true
                    properties:
                      add:
                        items:
                          type: string
                        nullable: true
                        type: array
                      drop:
                        items:
                          type: string
                        nullable: true
                        type: array
                    type: object
                  privileged:
                    nullable: true
                    type: boolean
                  procMount:
                    nullable: true
                    type: string
                  readOnlyRootFilesystem:
                    nullable: true
                    type: boolean
                  runAsGroup:
                    format: int64
                    nullable: true
                    type: integer
                  runAsNonRoot:
                    nullable: true
                    type: boolean
                  runAsUser:
                    format: int64
                    nullable: true
                    type: integer
                  seLinuxOptions:
                    nullable: true
                    properties:
                      level:
                        nullable: true
                        type: string
                      role:
                        nullable: true
                        type: string
                      type:
                        nullable: true
                        type: string
                      user:
                        nullable: true
                        type: string
                    type: object
                  seccompProfile:
                    nullable: true
                    properties:
                      localhostProfile:
                        nullable: true
                        type: string
                      type:
                        type: string
                    required:
                    - type
                    type: object
                  windowsOptions:
                    nullable: true
                    properties:
                      gmsaCredentialSpec:
                        nullable: true
                        type: string
                      gmsaCredentialSpecName:
                        nullable: true
                        type: string
                      hostProcess:
                        nullable: true
                        type: boolean
                      runAsUserName:
                        nullable: true
                        type: string
                    type: object
                type: object
              serviceAccountName:
                description: |-
                  ServiceAccount the playbook pod runs as, letting tasks reach the Kubernetes API with that
                  identity's RBAC. When set, the SA's token is auto-mounted (Ansible's `kubernetes.core`
                  modules pick it up via in-cluster config). When unset, the pod runs with no API token at
                  all — create the ServiceAccount and its Role/RoleBinding yourself and name it here.
                nullable: true
                type: string
              startingDeadlineSeconds:
                description: |-
                  Grace window, in seconds, after a scheduled tick during which a run may still start. The
                  operator evaluates the schedule on a requeue rather than exactly on the tick, so this
                  absorbs the gap between a tick and the next reconcile (e.g. the operator was busy or
                  restarting). If more than this many seconds pass past a tick without the run starting, that
                  tick is skipped and the run waits for the next one. The same idea as a CronJob's
                  `.spec.startingDeadlineSeconds`. Only affects scheduled (`schedule`) plans. Defaults to 30.
                minimum: 0.0
                nullable: true
                type: integer
              successfulPlaysHistoryLimit:
                description: |-
                  How many successful `Play` history records to keep for this plan before the oldest are
                  pruned. Unlike the Job's short TTL, Plays are the durable run history. A terminal result is
                  temporarily exempt until it reaches the plan status. Defaults to 3.
                minimum: 0.0
                nullable: true
                type: integer
              suspend:
                default: false
                description: |-
                  When true, the operator stops starting new runs for this plan — the same idea as a
                  CronJob's `.spec.suspend`. A run already in progress is left to finish; only the *starting*
                  of new runs is gated. While suspended the `Suspended` printer column reads `true` and
                  `.status.nextRun` is cleared; the plan's phase keeps reflecting its underlying state.
                  Defaults to false.
                type: boolean
              template:
                description: The playbook will be built from this, some fields will be set automatically (vars, hosts)
                properties:
                  files:
                    description: Files for the playbook
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    nullable: true
                    type: array
                  playbook:
                    description: The actual playbook contents
                    type: string
                  requirements:
                    description: Runtime requirements (e.g. Ansible collections)
                    nullable: true
                    type: string
                  variables:
                    description: Variables for the playbook
                    items:
                      anyOf:
                      - required:
                        - secretRef
                      - required:
                        - inline
                      properties:
                        inline:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        secretRef:
                          properties:
                            name:
                              type: string
                          required:
                          - name
                          type: object
                      type: object
                    nullable: true
                    type: array
                required:
                - playbook
                type: object
              timeZone:
                description: Time zone for the _schedule_ field, if unset UTC is assumed
                nullable: true
                type: string
              ttlSecondsAfterFinished:
                description: |-
                  How long a finished run's Job (and its pod) is kept before Kubernetes' TTL controller
                  reaps it. The operator never deletes the Job itself, so this governs the ansible pod's
                  lifetime. Values below 60 seconds are silently raised to 60; unset uses the operator's
                  default.
                format: int32
                nullable: true
                type: integer
              verbosity:
                description: |-
                  Verbosity for `ansible-playbook`, mapped to `-v`…`-vvvv`. 0 (unset) adds no flag; values
                  above 4 are clamped to 4. Affects log detail only — it is not part of the execution hash, so
                  changing it does not re-run the playbook on already-current hosts.
                minimum: 0.0
                nullable: true
                type: integer
            required:
            - image
            - inventoryRefs
            - template
            type: object
          status:
            nullable: true
            properties:
              activeRun:
                description: |-
                  The run that is currently being applied, independent of the newly desired execution hash.
                  This remains stable while a spec change queues a replacement run, so the old Job, locks, and
                  managed-ssh resources continue to be reconciled until the run finishes.

                  Only what finishing that run needs: everything else about it lives in its immutable `Play`,
                  which is the record recovery reads. This copy is what lets the operator still release a run
                  whose `Play` was deleted out from under it.
                nullable: true
                properties:
                  attempt:
                    description: Attempt number represented by `jobName`.
                    minimum: 0.0
                    type: integer
                  executionHash:
                    description: The execution hash used to create this run's Job and infrastructure.
                    type: string
                  hosts:
                    description: Hosts targeted by this run, preserved even if the desired inventory changes while it runs.
                    items:
                      type: string
                    type: array
                  jobName:
                    description: The Job backing this run, which is also the name of its `Play`.
                    type: string
                  playUid:
                    description: UID of the immutable `Play` recovery record correlated with the Job and its pod template.
                    type: string
                  runId:
                    description: Stable per-attempt resource/cleanup identity, distinct even across same-hash retries.
                    type: string
                  triggeredSlot:
                    description: Start of the schedule slot consumed by this run, if it is scheduled.
                    nullable: true
                    type: string
                required:
                - attempt
                - executionHash
                - hosts
                - jobName
                - playUid
                - runId
                type: object
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      nullable: true
                      type: string
                    message:
                      nullable: true
                      type: string
                    reason:
                      nullable: true
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              currentHash:
                type: string
              currentJobName:
                description: |-
                  Name of the Job backing the currently-`Applying` run, if any. Looked up by name rather
                  than the `PLAYBOOKPLAN_HASH` label alone, since that label is stable across every retry
                  of an unchanged spec and could match an older, already-finished retry's Job.
                nullable: true
                type: string
              eligibleHosts:
                items:
                  properties:
                    hosts:
                      items:
                        type: string
                      type: array
                    name:
                      type: string
                  required:
                  - hosts
                  - name
                  type: object
                type: array
              hostsStatus:
                additionalProperties:
                  properties:
                    lastAppliedHash:
                      description: The execution hash last SUCCESSFULLY applied to this host. Only bumped on `HostOutcome::Succeeded`.
                      type: string
                    lastOutcome:
                      enum:
                      - Succeeded
                      - Failed
                      - Unknown
                      - NotReached
                      type: string
                    lastTransitionTime:
                      nullable: true
                      type: string
                  required:
                  - lastAppliedHash
                  - lastOutcome
                  type: object
                nullable: true
                type: object
              lastRenderedGeneration:
                format: int64
                nullable: true
                type: integer
              lastTriggeredRun:
                description: |-
                  The start of the schedule slot (`Timing::Now`'s window start) that a run was last started
                  for. The trigger gate compares the current slot against this so a run that completes inside
                  its grace window isn't immediately re-triggered by the next reconcile within that same
                  window. Reset whenever `current_hash` changes; `None` for unscheduled plans (no slot to
                  dedupe against).
                nullable: true
                type: string
              nextRun:
                nullable: true
                type: string
              phase:
                enum:
                - Pending
                - Delayed
                - Applying
                - Scheduled
                - Failed
                - Succeeded
                - UnauthorizedNamespace
                type: string
              retryCount:
                description: |-
                  The attempt number of the current run, which is what distinguishes retries in the Job name
                  (`apply-{plan}-{shortid}-{n}`). Reset to 0 whenever `currentHash` changes, but that reset
                  only ever lowers the *starting point*: a new attempt is numbered past every attempt still
                  claiming a name — all of this plan's Jobs and all of its retained `Play` records, whatever
                  revision they belong to — so it can advance by more than one, and a new revision does not
                  restart at 1 while earlier runs are still retained. Names are reserved plan-wide rather than
                  per revision because the short id truncates a hash over the plan and the revision, so two
                  revisions of one plan can share one; see `reconciler::select_job`.
                minimum: 0.0
                type: integer
              summary:
                nullable: true
                type: string
            required:
            - conditions
            - currentHash
            - eligibleHosts
            - phase
            - retryCount
            type: object
        required:
        - spec
        title: PlaybookPlan
        type: object
        x-kubernetes-validations:
        - message: 'PlaybookPlan name must be at most 63 characters: it is used as a label value on the objects each run creates'
          rule: '!has(self.metadata.name) || self.metadata.name.size() <= 63'
    served: true
    storage: true
    subresources:
      status: {}
