[book]
title = "Ansible Operator Guide"
description = "User and cluster-operator guide for the Ansible Operator: run Ansible playbooks against cluster nodes and external hosts from Kubernetes resources."
authors = ["Christian Danscheid"]
language = "en"
src = "src"

[build]
# The default creates an empty page for a SUMMARY.md entry whose file is missing, so a broken entry
# would build (and ship) instead of failing CI.
create-missing = false

[output.html]
# The guide is published as a GitHub project page, under the repository name. Without this the
# 404 page's asset links resolve against whatever path was not found.
site-url = "/ansible-operator/"
git-repository-url = "https://github.com/webd97/ansible-operator"
edit-url-template = "https://github.com/webd97/ansible-operator/edit/main/docs/{path}"
default-theme = "rust"
preferred-dark-theme = "ayu"
no-section-label = false

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
